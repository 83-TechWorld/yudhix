server:
  port: 8084

spring:
  application:
    name: yudhix-link

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/yudhix}
    username: ${SPRING_DATASOURCE_USERNAME:yudhix}
    password: ${SPRING_DATASOURCE_PASSWORD:yudhix_dev_password_2026}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    baseline-on-migrate: true

yudhix:
  security:
    master-key: ${MASTER_KEY:0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef}

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics
