# API: yudhix-sense. Stateless, horizontally scaled. Migrations run on start under a Postgres
# advisory lock, so any number of replicas can start at once.
apiVersion: apps/v1
kind: Deployment
metadata: { name: api, labels: { app: api } }
spec:
  replicas: 2
  strategy: { rollingUpdate: { maxUnavailable: 0, maxSurge: 1 } }
  selector: { matchLabels: { app: api } }
  template:
    metadata: { labels: { app: api } }
    spec:
      securityContext: { runAsNonRoot: true, runAsUser: 10001, seccompProfile: { type: RuntimeDefault } }
      topologySpreadConstraints:
        - { maxSkew: 1, topologyKey: kubernetes.io/hostname, whenUnsatisfiable: ScheduleAnyway, labelSelector: { matchLabels: { app: api } } }
      terminationGracePeriodSeconds: 30
      containers:
        - name: api
          image: yudhix/api:local
          ports: [{ name: http, containerPort: 8000 }]
          envFrom:
            - configMapRef: { name: yudhix-config }
          env:
            - { name: WEB_CONCURRENCY, value: "2" }
            - { name: KEYCLOAK_JWKS_URL, value: "http://keycloak:8080/auth/realms/yudhix/protocol/openid-connect/certs" }
            - name: KEYCLOAK_ISSUER
              value: "$(PUBLIC_URL)/auth/realms/yudhix"
            - { name: APP_URL, value: "$(PUBLIC_URL)" }
            - { name: CORS_ORIGINS, value: "$(PUBLIC_URL)" }
            - name: PG_PASSWORD
              valueFrom: { secretKeyRef: { name: yudhix-secrets, key: POSTGRES_PASSWORD } }
            - name: AUTHOR_HMAC_KEY
              valueFrom: { secretKeyRef: { name: yudhix-secrets, key: AUTHOR_HMAC_KEY } }
            - name: SMTP_USER
              valueFrom: { secretKeyRef: { name: yudhix-secrets, key: SMTP_USER, optional: true } }
            - name: SMTP_PASSWORD
              valueFrom: { secretKeyRef: { name: yudhix-secrets, key: SMTP_PASSWORD, optional: true } }
            - name: YOUTUBE_API_KEY
              valueFrom: { secretKeyRef: { name: yudhix-secrets, key: YOUTUBE_API_KEY, optional: true } }
          startupProbe: { httpGet: { path: /readyz, port: http }, periodSeconds: 5, failureThreshold: 36 }
          readinessProbe: { httpGet: { path: /readyz, port: http }, periodSeconds: 10, timeoutSeconds: 3 }
          livenessProbe: { httpGet: { path: /healthz, port: http }, periodSeconds: 20, timeoutSeconds: 3 }
          resources:
            requests: { cpu: 200m, memory: 256Mi }
            limits: { cpu: "1", memory: 768Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts: [{ name: tmp, mountPath: /tmp }]
      volumes: [{ name: tmp, emptyDir: {} }]
---
apiVersion: v1
kind: Service
metadata: { name: api, labels: { app: api } }
spec:
  selector: { app: api }
  ports: [{ name: http, port: 8000, targetPort: http }]
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: { name: api }
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: api }
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - { type: Resource, resource: { name: cpu, target: { type: Utilization, averageUtilization: 70 } } }
    - { type: Resource, resource: { name: memory, target: { type: Utilization, averageUtilization: 80 } } }
  behavior:
    scaleDown: { stabilizationWindowSeconds: 300 }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata: { name: api }
spec: { minAvailable: 1, selector: { matchLabels: { app: api } } }
