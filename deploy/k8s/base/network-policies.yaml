# Only the gateway is reachable from outside the namespace. Web, API and Keycloak accept traffic
# from the gateway (plus API -> Keycloak for signing keys, and the setup job -> Keycloak).
# Note: needs a CNI that enforces NetworkPolicy (Calico, Cilium, most managed clusters).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: web-from-gateway }
spec:
  podSelector: { matchLabels: { app: web } }
  policyTypes: [Ingress]
  ingress: [{ from: [{ podSelector: { matchLabels: { app: gateway } } }] }]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: api-from-gateway }
spec:
  podSelector: { matchLabels: { app: api } }
  policyTypes: [Ingress]
  ingress: [{ from: [{ podSelector: { matchLabels: { app: gateway } } }] }]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: keycloak-from-gateway-api }
spec:
  podSelector: { matchLabels: { app: keycloak } }
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: { matchLabels: { app: gateway } }
        - podSelector: { matchLabels: { app: api } }
        - podSelector: { matchLabels: { app: keycloak-setup } }
        - podSelector: { matchLabels: { app: keycloak } }     # cluster members
