# Catches all outgoing email locally (verification, invites). UI: kubectl -n yudhix port-forward svc/mailpit 8027:8025
apiVersion: apps/v1
kind: Deployment
metadata: { name: mailpit, labels: { app: mailpit } }
spec:
  replicas: 1
  selector: { matchLabels: { app: mailpit } }
  template:
    metadata: { labels: { app: mailpit } }
    spec:
      containers:
        - name: mailpit
          image: axllent/mailpit:latest
          imagePullPolicy: IfNotPresent
          ports: [{ name: smtp, containerPort: 1025 }, { name: ui, containerPort: 8025 }]
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits: { cpu: 200m, memory: 64Mi }
---
apiVersion: v1
kind: Service
metadata: { name: mailpit, labels: { app: mailpit } }
spec:
  selector: { app: mailpit }
  ports: [{ name: smtp, port: 1025, targetPort: smtp }, { name: ui, port: 8025, targetPort: ui }]
