# Web container: serves the Angular build. Listens on $PORT (Zoho Catalyst: X_ZOHO_CATALYST_LISTEN_PORT).
server {
  listen ${PORT};
  server_name _;
  root /usr/share/nginx/html;
  server_tokens off;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml application/manifest+json;

  # Hashed bundles never change: cache for a year
  location ~* \.(?:js|css|woff2?)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }
  # Must always be fresh
  location = /config.json { add_header Cache-Control "no-store"; try_files $uri =404; }
  location = /index.html { add_header Cache-Control "no-cache"; }
  location = /ngsw.json { add_header Cache-Control "no-cache"; }
  location = /ngsw-worker.js { add_header Cache-Control "no-cache"; }

  location = /healthz { access_log off; default_type text/plain; return 200 "ok"; }

  # Single-page app: unknown paths load index.html
  location / { try_files $uri $uri/ /index.html; }
}
